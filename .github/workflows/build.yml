name: Build Java 1.8.8 plugin

on:
  push:
    branches: [java-1.8.8]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build the plugin
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JerryTheDawg-plugin
          path: build/libs/*.jar
      - name: Publish a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: java-1.8.8-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Jerry the Dawg for Java 1.8.8 (plugin) - build ${{ github.run_number }}"
          body: |
            The Spigot/Paper plugin for **Minecraft Java Edition 1.8.8**.
            Download `JerryTheDawg-*.jar` below and put it in your server's `plugins` folder.
            (Looking for the Bedrock add-on? That's on the MAIN branch.)
          files: build/libs/*.jar
          make_latest: false
