name: Build Jerry Voice app

on:
  push:
    paths:
      - "voice-app/**"
      - ".github/workflows/voice-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build the APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle -p voice-app assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp voice-app/app/build/outputs/apk/release/app-release.apk out/JerryVoice.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JerryVoice
          path: out/JerryVoice.apk
      - name: Publish (always at the same download link)
        if: github.ref == 'refs/heads/MAIN'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voice-app
          target_commitish: ${{ github.sha }}
          name: "Jerry Voice app (Android)"
          body: |
            **Jerry Voice**: talk to Jerry out loud in Minecraft Bedrock on Android, no Termux needed.
            Download `JerryVoice.apk` below and install it (allow installing from your browser when asked).
            Build ${{ github.run_number }}. Setup guide: voice-app/README.md
          files: out/JerryVoice.apk
          make_latest: false
